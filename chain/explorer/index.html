<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8">
  <title>AbilityChain Explorer</title>
  <link rel="stylesheet" href="explorer.css">

  <style>
    /* --- AUTH POPUP (D‑Minimal, Blau + Gold) --- */
    #auth-overlay {
      position: fixed;
      inset: 0;
      background: rgba(0,0,0,0.6);
      display: none;
      align-items: center;
      justify-content: center;
      z-index: 9999;
    }
    #auth-popup {
      background: #000;
      border: 2px solid #FFD700;
      border-radius: 8px;
      padding: 20px;
      width: 300px;
      color: #FFD700;
      font-family: system-ui, sans-serif;
      position: relative;
    }
    #auth-popup input {
      width: 100%;
      margin: 5px 0;
      padding: 6px 8px;
      background: #000;
      border: 1px solid #FFD700;
      color: #FFD700;
    }
    #auth-popup button {
      background: #0055FF;
      color: #FFD700;
      border: none;
      padding: 6px 10px;
      margin: 4px 2px;
      cursor: pointer;
    }
    #auth-close {
      position: absolute;
      top: 6px;
      right: 6px;
      background: transparent;
      border: none;
      color: #FFD700;
      font-size: 16px;
      cursor: pointer;
    }
    .auth-msg {
      margin-top: 6px;
      font-size: 12px;
    }
  </style>
</head>

<body>

  <header>
    <h1>AbilityChain Explorer</h1>
    <input id="search" placeholder="Block, TX oder Adresse suchen…">

    <!-- AUTH BUTTONS -->
    <div style="margin-top:20px;">
      <button data-auth="login" id="btn-login">Login / Register</button>
      <button data-auth="settings" id="btn-settings" style="display:none;">Settings</button>
      <button data-auth="logout" id="btn-logout" style="display:none;">Logout</button>
    </div>
  </header>

  <main>
    <section id="latest-blocks"></section>
    <section id="latest-txs"></section>
  </main>

  <!-- POPUP CONTAINER -->
  <div id="auth-overlay">
    <div id="auth-popup">
      <button id="auth-close">×</button>
      <h2 style="margin-top:0;">AbilityChain Login</h2>

      <div style="margin-bottom:10px;">
        <button id="auth-mode-login">Login</button>
        <button id="auth-mode-register">Register</button>
      </div>

      <!-- LOGIN -->
      <div id="auth-login-box">
        <input id="login-user" placeholder="Username">
        <input id="login-pw1" type="password" maxlength="16" placeholder="Passwort (16 Zeichen)">
        <button id="login-btn">Login</button>
        <div id="login-msg" class="auth-msg"></div>
      </div>

      <!-- REGISTER -->
      <div id="auth-register-box" style="display:none;">
        <input id="reg-user" placeholder="Username">
        <input id="reg-pw1" type="password" maxlength="16" placeholder="Passwort (16 Zeichen)">
        <input id="reg-pw2" type="password" maxlength="4" placeholder="2. Passwort (4 Zeichen)">
        <button id="reg-btn">Account erstellen</button>
        <div id="reg-msg" class="auth-msg"></div>
      </div>
    </div>
  </div>

  <!-- EXPLORER LOGIK -->
  <script src="explorer.js"></script>

  <!-- AUTH LOGIK -->
  <script type="module" src="../../global/auth.js"></script>

  <script type="module">
    import { initAuthUI, isLoggedIn, logout } from "../../global/auth.js";

    initAuthUI();

    const btnLogin = document.getElementById("btn-login");
    const btnSettings = document.getElementById("btn-settings");
    const btnLogout = document.getElementById("btn-logout");

    function updateUI() {
      if (isLoggedIn()) {
        btnLogin.style.display = "none";
        btnSettings.style.display = "inline-block";
        btnLogout.style.display = "inline-block";
      } else {
        btnLogin.style.display = "inline-block";
        btnSettings.style.display = "none";
        btnLogout.style.display = "none";
      }
    }

    updateUI();

    btnLogout.addEventListener("click", () => {
      logout();
      updateUI();
    });

    btnSettings.addEventListener("click", () => {
      window.location.href = "../../settings/index.html";
    });
  </script>

</body>
</html>
