<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8">
  <title>AbilityChain Settings</title>

  <style>
    body {
      margin: 0;
      background: #000;
      color: #FFD700;
      font-family: system-ui, sans-serif;
      text-align: center;
      padding-top: 60px;
    }

    .box {
      display: inline-block;
      border: 1px solid #FFD700;
      padding: 20px;
      border-radius: 8px;
      min-width: 320px;
    }

    button {
      background: #0055FF;
      color: #FFD700;
      border: none;
      padding: 8px 14px;
      margin: 6px;
      cursor: pointer;
    }

    input {
      background: #000;
      border: 1px solid #FFD700;
      color: #FFD700;
      padding: 6px 8px;
      width: 80%;
      margin: 4px 0;
    }

    .seed-section {
      margin-top: 14px;
      border: 1px solid #FFD700;
      border-radius: 6px;
      padding: 10px;
    }

    .seed-grid {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 6px;
      max-height: 160px;
      overflow-y: auto;
      border: 1px solid #FFD700;
      padding: 8px;
      border-radius: 6px;
      user-select: none;
      touch-action: pan-y; /* SCROLL FIX */
    }

    .seed-item {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 4px;
    }

    .seed-item div {
      background: #000;
      color: #FFD700;
      border: 1px solid #FFD700;
      border-radius: 4px;
      padding: 4px;
      font-size: 13px;
      text-align: center;
      width: 100%;
    }

    .copy-btn {
      background: #0033AA;
      padding: 4px 6px;
      font-size: 11px;
      border-radius: 4px;
    }

    #seed-error {
      color: #FF4444;
      margin-top: 10px;
      min-height: 20px;
    }
  </style>
</head>

<body>

  <div class="box">
    <h1>Settings</h1>

    <div id="settings-info"></div>

    <h3>Seeds anzeigen</h3>
    <input id="pw2-input" type="password" maxlength="4" placeholder="2. Passwort (4 Zeichen)">
    <button id="show-seeds-btn">Seeds anzeigen</button>

    <div id="seed-error"></div>

    <div id="seed-container" style="display:none;">

      <div class="seed-section">
        <h4>12‑Wort‑Seed</h4>
        <div id="seed12-grid" class="seed-grid"></div>
      </div>

      <div class="seed-section">
        <h4>24‑Wort‑Seed</h4>
        <div id="seed24-grid" class="seed-grid"></div>
      </div>

    </div>

    <button id="logout-btn">Logout</button>
  </div>

  <script type="module">
    import { getCurrentUser, isLoggedIn, logout } from "../global/auth.js";
    import { PZQQETFUSIONMASTER } from "../wallet/pzqqet-0_standard.js";

    if (!isLoggedIn()) {
      window.location.href = "../index.html";
    }

    const user = getCurrentUser();

    document.getElementById("settings-info").innerHTML = `
      <p><strong>User:</strong> ${user.username}</p>
      <p><strong>Mask:</strong> ${user.mask}</p>
    `;

    const pw2Input = document.getElementById("pw2-input");
    const seedContainer = document.getElementById("seed-container");
    const seed12Grid = document.getElementById("seed12-grid");
    const seed24Grid = document.getElementById("seed24-grid");
    const seedError = document.getElementById("seed-error");

    document.getElementById("show-seeds-btn").onclick = () => {
      const pw2 = pw2Input.value;

      seedError.textContent = "";
      seedContainer.style.display = "none";

      if (pw2 !== user.pw2) {
        seedError.textContent = "Falsches 2. Passwort.";
        return;
      }

      const seed12 = user.seed12 || [];
      const seed24 = user.seed24 || [];

      seed12Grid.innerHTML = seed12
        .map(w => `
          <div class="seed-item">
            <div>${w}</div>
            <button class="copy-btn" onclick="navigator.clipboard.writeText('${w}')">Copy</button>
          </div>
        `)
        .join("");

      seed24Grid.innerHTML = seed24
        .map(w => `
          <div class="seed-item">
            <div>${w}</div>
            <button class="copy-btn" onclick="navigator.clipboard.writeText('${w}')">Copy</button>
          </div>
        `)
        .join("");

      seedContainer.style.display = "block";
    };

    document.getElementById("logout-btn").onclick = () => {
      logout();
      window.location.href = "../index.html";
    };
  </script>

</body>
</html>
