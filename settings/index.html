<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8">
  <title>AbilityChain Settings</title>

  <style>
    body {
      margin: 0;
      background: #000;
      color: #FFD700;
      font-family: system-ui, sans-serif;
      text-align: center;
      padding-top: 60px;
    }

    .box {
      display: inline-block;
      border: 1px solid #FFD700;
      padding: 20px;
      border-radius: 8px;
      min-width: 320px;
    }

    button {
      background: #0055FF;
      color: #FFD700;
      border: none;
      padding: 8px 14px;
      margin: 6px;
      cursor: pointer;
    }

    input {
      background: #000;
      border: 1px solid #FFD700;
      color: #FFD700;
      padding: 6px 8px;
      width: 80%;
      margin: 4px 0;
    }

    .seed-section {
      margin-top: 14px;
      border: 1px solid #FFD700;
      border-radius: 6px;
      padding: 10px;
    }

    .seed-grid {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 6px;
      max-height: 160px;
      overflow-y: auto;
      border: 1px solid #FFD700;
      padding: 8px;
      border-radius: 6px;
      user-select: none;
      touch-action: none;
    }

    .seed-grid div {
      background: #000;
      color: #FFD700;
      border: 1px solid #FFD700;
      border-radius: 4px;
      padding: 4px;
      font-size: 13px;
      text-align: center;
    }
  </style>
</head>

<body>

  <div class="box">
    <h1>Settings</h1>

    <div id="settings-info"></div>

    <h3>Seeds anzeigen</h3>
    <input id="pw2-input" type="password" maxlength="4" placeholder="2. Passwort (4 Zeichen)">
    <button id="show-seeds-btn">Seeds anzeigen</button>

    <div id="seed-container" style="display:none;">

      <div class="seed-section">
        <h4>12‑Wort‑Seed</h4>
        <div id="seed12-grid" class="seed-grid"></div>
        <button id="copy12">Kopieren</button>
      </div>

      <div class="seed-section">
        <h4>24‑Wort‑Seed</h4>
        <div id="seed24-grid" class="seed-grid"></div>
        <button id="copy24">Kopieren</button>
      </div>

    </div>

    <button id="logout-btn">Logout</button>
  </div>

  <script type="module">
    import { getCurrentUser, isLoggedIn, logout } from "../global/auth.js";
    import { PZQQET_FUSION_MASTER } from "../wallet/pzqqet-0_standard.js";

    if (!isLoggedIn()) {
      window.location.href = "../index.html";
    }

    const user = getCurrentUser();
    const info = document.getElementById("settings-info");
    info.innerHTML = `
      <p><strong>User:</strong> ${user.username}</p>
      <p><strong>Mask:</strong> ${user.mask}</p>
    `;

    function verifyAndDeriveIdentity(username, pw2) {
      try {
        const pool = PZQQET_FUSION_MASTER.Axioms.wordPool;

        const seed12 = Array.from({ length: 12 }, () =>
          pool[Math.floor(Math.random() * pool.length)]
        );

        const seed24 = Array.from({ length: 24 }, () =>
          pool[Math.floor(Math.random() * pool.length)]
        );

        return { seed12, seed24 };
      } catch {
        return { seed12: [], seed24: [] };
      }
    }

    const pw2Input = document.getElementById("pw2-input");
    const seedContainer = document.getElementById("seed-container");
    const seed12Grid = document.getElementById("seed12-grid");
    const seed24Grid = document.getElementById("seed24-grid");
    const showBtn = document.getElementById("show-seeds-btn");

    let seed12 = [];
    let seed24 = [];

    showBtn.addEventListener("click", () => {
      const pw2 = pw2Input.value;

      if (pw2 !== user.pw2) {
        seedContainer.style.display = "block";
        seedContainer.innerHTML = "<p>Falsches 2. Passwort.</p>";
        return;
      }

      const result = verifyAndDeriveIdentity(user.username, pw2);
      seed12 = result.seed12;
      seed24 = result.seed24;

      seedContainer.style.display = "block";
      seed12Grid.innerHTML = seed12.map(w => `<div>${w}</div>`).join("");
      seed24Grid.innerHTML = seed24.map(w => `<div>${w}</div>`).join("");
    });

    function copySeed(words) {
      if (words.length) navigator.clipboard.writeText(words.join(" "));
    }

    document.getElementById("copy12").addEventListener("click", () => copySeed(seed12));
    document.getElementById("copy24").addEventListener("click", () => copySeed(seed24));

    document.getElementById("logout-btn").addEventListener("click", () => {
      logout();
      window.location.href = "../index.html";
    });
  </script>

</body>
</html>
