<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8" />
  <title>AbilityChain – Settings</title>

  <style>
    body {
      margin: 0;
      background: #000;
      color: #FFD700;
      font-family: system-ui, sans-serif;
      display: flex;
      flex-direction: column;
      height: 100vh;
    }

    /* HEADER / NAVIGATION */
    header {
      display: flex;
      justify-content: center;
      gap: 20px;
      padding: 14px 0;
      border-bottom: 2px solid #FFD700;
      background: #000;
      position: sticky;
      top: 0;
      z-index: 10;
    }

    header button {
      background: #0055FF;
      color: #FFD700;
      border: none;
      padding: 8px 14px;
      cursor: pointer;
      border-radius: 4px;
    }

    main {
      flex: 1;
      display: flex;
      justify-content: center;
      align-items: flex-start;
      overflow-y: auto;
      padding: 40px 0;
    }

    .box {
      border: 1px solid #FFD700;
      padding: 20px;
      border-radius: 8px;
      width: 360px;
      background: #000;
      text-align: center;
    }

    input {
      background: #000;
      border: 1px solid #FFD700;
      color: #FFD700;
      padding: 6px 8px;
      width: 80%;
      margin: 4px 0;
    }

    button.action {
      background: #0055FF;
      color: #FFD700;
      border: none;
      padding: 8px 14px;
      margin: 6px;
      cursor: pointer;
      border-radius: 4px;
    }

    .seed-section {
      margin-top: 14px;
      border: 1px solid #FFD700;
      border-radius: 6px;
      padding: 10px;
    }

    .seed-grid {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 6px;
      max-height: 160px;
      overflow-y: auto;
      border: 1px solid #FFD700;
      padding: 8px;
      border-radius: 6px;
      user-select: none;
    }

    .seed-grid div {
      background: #000;
      color: #FFD700;
      border: 1px solid #FFD700;
      border-radius: 4px;
      padding: 4px;
      font-size: 13px;
      text-align: center;
    }

    #seed-error {
      color: #FF4444;
      margin-top: 10px;
      min-height: 20px;
    }
  </style>
</head>

<body>

  <!-- NAVIGATION -->
  <header>
    <button id="nav-home">Home</button>
    <button id="nav-wallet">Wallet</button>
    <button id="nav-explorer">Explorer</button>
    <button id="nav-logout">Logout</button>
  </header>

  <main>
    <div class="box">
      <h1>Settings</h1>

      <div id="settings-info"></div>

      <h3>Seeds anzeigen</h3>
      <input id="pw2-input" type="password" maxlength="4" placeholder="2. Passwort (4 Zeichen)">
      <button class="action" id="show-seeds-btn">Seeds anzeigen</button>

      <div id="seed-error"></div>

      <div id="seed-container" style="display:none;">
        <div class="seed-section">
          <h4>12‑Wort‑Seed</h4>
          <div id="seed12-grid" class="seed-grid"></div>
        </div>

        <div class="seed-section">
          <h4>24‑Wort‑Seed</h4>
          <div id="seed24-grid" class="seed-grid"></div>
        </div>
      </div>

      <h3>Theme</h3>
      <button class="action" id="theme-toggle">Dark / Light</button>

      <h3>Account</h3>
      <button class="action" id="pw2-change">PW2 ändern</button>
      <button class="action" id="mask-refresh">Mask regenerieren</button>

    </div>
  </main>

  <script type="module">
    import { getCurrentUser, isLoggedIn, logout, saveUser } from "../global/auth.js";
    import { PZQQET_FUSION_MASTER } from "../wallet/pzqqet-0_standard.js";

    /* LOGIN CHECK */
    if (!isLoggedIn()) {
      window.location.href = "../index.html";
    }

    const user = getCurrentUser();

    /* NAVIGATION */
    document.getElementById("nav-home").onclick = () => window.location.href = "../index.html";
    document.getElementById("nav-wallet").onclick = () => window.location.href = "../wallet/index.html";
    document.getElementById("nav-explorer").onclick = () => window.location.href = "../chain/explorer/index.html";
    document.getElementById("nav-logout").onclick = () => { logout(); window.location.href = "../index.html"; };

    /* USER INFO */
    const info = document.getElementById("settings-info");
    info.innerHTML = `
      <p><strong>User:</strong> ${user.username}</p>
      <p><strong>Mask:</strong> ${user.mask}</p>
    `;

    /* DETERMINISTISCHE SEED-ABLEITUNG */
    function deriveSeeds(username, pw1, pw2, mask) {
      const pool = PZQQET_FUSION_MASTER.Axioms.wordPool;

      const base = username + pw1 + pw2 + mask;
      let hash = 0;

      for (let i = 0; i < base.length; i++) {
        hash = (hash * 31 + base.charCodeAt(i)) % 999999;
      }

      const seed12 = [];
      const seed24 = [];

      for (let i = 0; i < 24; i++) {
        const index = (hash + i * 37) % pool.length;
        if (i < 12) seed12.push(pool[index]);
        seed24.push(pool[index]);
      }

      return { seed12, seed24 };
    }

    /* SEED-LOGIK */
    const pw2Input = document.getElementById("pw2-input");
    const seedContainer = document.getElementById("seed-container");
    const seed12Grid = document.getElementById("seed12-grid");
    const seed24Grid = document.getElementById("seed24-grid");
    const seedError = document.getElementById("seed-error");

    document.getElementById("show-seeds-btn").onclick = () => {
      const pw2 = pw2Input.value;

      seedError.textContent = "";
      seedContainer.style.display = "none";

      if (pw2 !== user.pw2) {
        seedError.textContent = "Falsches 2. Passwort.";
        return;
      }

      const result = deriveSeeds(user.username, user.pw1, user.pw2, user.mask);

      seed12Grid.innerHTML = result.seed12.map(w => `<div>${w}</div>`).join("");
      seed24Grid.innerHTML = result.seed24.map(w => `<div>${w}</div>`).join("");

      seedContainer.style.display = "block";
    };

    /* THEME SWITCHER (Hook – Logik kommt später) */
    document.getElementById("theme-toggle").onclick = () => {
      alert("Theme-Switch kommt später.");
    };

    /* PW2 ÄNDERN */
    document.getElementById("pw2-change").onclick = () => {
      const newPw2 = prompt("Neues 2. Passwort (4 Zeichen):");
      if (!newPw2 || newPw2.length !== 4) return alert("Ungültig.");
      user.pw2 = newPw2;
      saveUser(user);
      alert("PW2 geändert.");
    };

    /* MASK REGENERIEREN */
    document.getElementById("mask-refresh").onclick = () => {
      user.mask = Math.random().toString(36).substring(2, 10).toUpperCase();
      saveUser(user);
      alert("Mask regeneriert.");
      window.location.reload();
    };
  </script>

</body>
</html>
